name: Auto Release

on:
  schedule:
    # 5th of each month at 10:00 UTC — after HA's monthly release
    - cron: "0 10 5 * *"
  workflow_dispatch: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ---------- Job 0: merge approved dependabot PRs ----------
  merge-deps:
    name: Merge Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Merge approved dependabot PRs
        run: |
          # Find all open dependabot PRs that have passed CI
          prs=$(gh pr list --author "app/dependabot" --state open --json number,mergeable,reviewDecision --jq '.[] | select(.mergeable == "MERGEABLE") | .number')
          if [ -z "$prs" ]; then
            echo "No mergeable dependabot PRs found"
            exit 0
          fi
          for pr in $prs; do
            echo "Merging dependabot PR #${pr}..."
            if gh pr merge "$pr" --squash --admin; then
              echo "✓ PR #${pr} merged"
            else
              echo "⚠ PR #${pr} merge failed (non-blocking)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull merged changes
        run: git pull --rebase origin main

  # ---------- Job 1: compute versions ----------
  versions:
    name: Compute Versions
    needs: merge-deps
    runs-on: ubuntu-latest
    outputs:
      prev-ha: ${{ steps.calc.outputs.prev_ha }}
      prev-ha-image: ${{ steps.calc.outputs.prev_ha_image }}
      next-tag: ${{ steps.calc.outputs.next_tag }}
      next-version: ${{ steps.calc.outputs.next_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Calculate versions
        id: calc
        run: |
          # Previous month HA version (e.g. 2026.3)
          prev_ha=$(date -d "$(date +%Y-%m-01) -1 month" +%Y.%-m)
          echo "prev_ha=${prev_ha}" >> "$GITHUB_OUTPUT"
          echo "prev_ha_image=ghcr.io/home-assistant/home-assistant:${prev_ha}" >> "$GITHUB_OUTPUT"

          # Latest hactl tag and next minor bump
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            echo "next_tag=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "next_version=0.1.0" >> "$GITHUB_OUTPUT"
          else
            # Parse major.minor.patch and bump minor
            major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
            minor=$(echo "$latest" | sed 's/^v//' | cut -d. -f2)
            next_minor=$((minor + 1))
            echo "next_tag=v${major}.${next_minor}.0" >> "$GITHUB_OUTPUT"
            echo "next_version=${major}.${next_minor}.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag does not exist
        run: |
          tag="${{ steps.calc.outputs.next_tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists — skipping auto-release"
            exit 1
          fi
          echo "Tag ${tag} is available"

  # ---------- Job 2: test matrix ----------
  test:
    name: Test (HA ${{ matrix.ha-version }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha-version: [stable, prev, dev]
        include:
          - ha-version: stable
            image: ghcr.io/home-assistant/home-assistant:stable
            required: true
          - ha-version: prev
            image: ${{ needs.versions.outputs.prev-ha-image }}
            required: true
          - ha-version: dev
            image: ghcr.io/home-assistant/home-assistant:dev
            required: false
    outputs:
      stable-version: ${{ steps.detect.outputs.ha_version }}
      prev-version: ${{ steps.detect.outputs.ha_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run integration tests
        if: matrix.required
        run: make test-int
        env:
          HACTL_HA_IMAGE: ${{ matrix.image }}

      - name: Run integration tests (non-blocking)
        if: '!matrix.required'
        run: |
          if make test-int; then
            echo "::notice::HA dev integration tests passed"
          else
            echo "::warning::HA dev integration tests failed (non-blocking)"
          fi
        env:
          HACTL_HA_IMAGE: ${{ matrix.image }}

      - name: Detect HA version from container
        id: detect
        if: always()
        run: |
          # The tested HA version is logged by testcontainers; extract from test output
          # Fallback: use the image tag
          tag=$(echo "${{ matrix.image }}" | sed 's|.*/home-assistant:||')
          echo "ha_version=${tag}" >> "$GITHUB_OUTPUT"

      - name: Write version artifact
        if: success()
        run: echo "${{ steps.detect.outputs.ha_version }}" > "ha-version-${{ matrix.ha-version }}.txt"

      - name: Upload version artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-version-${{ matrix.ha-version }}
          path: "ha-version-${{ matrix.ha-version }}.txt"

  # ---------- Job 3: collect versions & release ----------
  release:
    name: Release
    needs: [versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for meaningful changes since last tag
        id: changes
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count non-chore/ci/docs commits since last tag
          count=$(git log "${latest}..HEAD" --oneline --no-merges \
            --invert-grep --grep="^docs:" --grep="^ci:" --grep="^chore:" \
            | wc -l | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found ${count} meaningful commits since ${latest}"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No meaningful commits since ${latest} — skipping release"
          fi

      - name: Skip release if no changes
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "No meaningful changes — skipping release"
          exit 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.changes.outputs.has_changes == 'true'
        with:
          go-version-file: go.mod

      - name: Download version artifacts
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ha-version-*
          merge-multiple: true

      - name: Collect tested HA versions
        if: steps.changes.outputs.has_changes == 'true'
        id: tested
        run: |
          versions=""
          for f in ha-version-*.txt; do
            [ -f "$f" ] || continue
            v=$(cat "$f")
            if [ -n "$versions" ]; then
              versions="${versions}, ${v}"
            else
              versions="${v}"
            fi
          done
          echo "tested_ha=${versions}" >> "$GITHUB_OUTPUT"
          echo "Tested HA versions: ${versions}"

      - name: Generate release notes
        if: steps.changes.outputs.has_changes == 'true'
        id: notes
        run: |
          tag="${{ needs.versions.outputs.next-tag }}"
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          range="${latest}..HEAD"
          if [ -z "$latest" ]; then
            range="HEAD"
          fi

          {
            echo "## hactl ${tag}"
            echo ""
            echo "**Tested against Home Assistant:** ${{ steps.tested.outputs.tested_ha }}"
            echo ""

            # Features
            feats=$(git log "${range}" --oneline --no-merges --grep="^feat" | sed 's/^[a-f0-9]* /- /')
            if [ -n "$feats" ]; then
              echo "### 🚀 Features"
              echo "$feats"
              echo ""
            fi

            # Fixes
            fixes=$(git log "${range}" --oneline --no-merges --grep="^fix" | sed 's/^[a-f0-9]* /- /')
            if [ -n "$fixes" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$fixes"
              echo ""
            fi

            # Dependencies (dependabot merges)
            deps=$(git log "${range}" --oneline --no-merges --grep="^build(deps)" | sed 's/^[a-f0-9]* /- /')
            if [ -n "$deps" ]; then
              echo "### 📦 Dependencies"
              echo "$deps"
              echo ""
            fi

            echo "---"
            echo "**Full Changelog:** https://github.com/swifty99/hactl/compare/${latest}...${tag}"
          } > release-notes.md

          echo "Release notes:"
          cat release-notes.md

      - name: Create and push tag
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          tag="${{ needs.versions.outputs.next-tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Auto-release ${tag} (tested: HA ${{ steps.tested.outputs.tested_ha }})"
          git push origin "${tag}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changes.outputs.has_changes == 'true'

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: steps.changes.outputs.has_changes == 'true'

      - uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TESTED_HA: ${{ steps.tested.outputs.tested_ha }}
